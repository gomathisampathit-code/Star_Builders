<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#1f2226;--tx:#eceae4;--mu:#9aa0a8;--ac:#3fb8a2;--acx:#0b1210;--rd:#f2877f;--bd:#33373d}}
:root[data-theme="dark"]{--bg:#15171a;--card:#1f2226;--tx:#eceae4;--mu:#9aa0a8;--ac:#3fb8a2;--acx:#0b1210;--rd:#f2877f;--bd:#33373d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
.wrap{max-width:640px;margin:auto;padding:12px}
h1{font-size:18px;margin:0}
.top{display:flex;gap:8px;align-items:center;margin-bottom:10px}
select,input,button{font:inherit;color:var(--tx)}
select,input{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.c small{color:var(--mu);display:block;font-size:12px}.c b{font-size:16px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1}.tabs .on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.row{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
.row .l{min-width:0}.row .t{font-weight:600}.row .s{color:var(--mu);font-size:13px;overflow-wrap:anywhere}
.row .r{text-align:right;white-space:nowrap}.out{color:var(--rd)}.in{color:var(--ac)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:14px 20px;border-radius:30px;box-shadow:0 4px 14px #0004}
dialog{max-height:90vh;overflow:auto;border:1px solid var(--bd);border-radius:16px;background:var(--bg);color:var(--tx);width:min(94vw,520px);padding:16px}
dialog::backdrop{background:#0008}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg .on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.acts{display:flex;gap:8px;margin-top:14px}.acts button{flex:1}
.bar{height:6px;border-radius:3px;background:var(--ac);margin-top:4px;opacity:.8}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.sec h2{font-size:15px;margin:0 0 8px}.li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd);font-size:14px}
.li:last-child{border:0}.mu{color:var(--mu);font-size:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
body:not(.adm) #v2,body:not(.adm) #m9,body.adm #m10,body:not(.adm) #m1,body:not(.adm) #m2,body:not(.adm) #m3,body:not(.adm) #m4,body:not(.adm) #m5,body:not(.adm) #m6{display:none!important}

body:not(.adm) #qa{display:none!important}
.menu button{width:100%;margin-bottom:8px;text-align:left}

<div id="lock"><div class="sec" style="width:min(92vw,360px)"><h1 style="text-align:center">Star Builders</h1><label>Enter app password</label><input type="password" id="lp" autocomplete="off"><div id="le" class="out" style="min-height:20px;margin:6px 0"></div><button class="p" id="lb" style="width:100%">Open</button></div></div>

<div id="v2" hidden></div>
</div>
<button class="p fab" id="add">+ Add entry</button>

<dialog id="dlg"><b id="dt">Add entry</b>

<input type="file" id="fi" accept=".xlsx,.xls,.csv" hidden></dialog>

 dr.forEach(i=>{const c=ws[XLSX.utils.encode_cell({r:i,c:0})];if(c&&c.t==='n')c.z='dd-mmm-yy'});

const nk=s=>String(s||'').toLowerCase().replace(/[^a-z]/g,'');
function mapCol(h){const k=nk(h);for(const f in AL)if(AL[f].includes(k))return f;return null}
const num=v=>{const n=parseFloat(String(v??'').replace(/[₹,\s]|rs\.?/gi,''));return isNaN(n)?0:n};
function pd(v){if(v instanceof Date&&!isNaN(v))return new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString().slice(0,10);
 const s=String(v||'').trim();let m=s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[a-z]*[-\/ ](\d{2,4})$/);if(m){const y=m[3].length==2?'20'+m[3]:m[3];return y+'-'+String(MO.findIndex(x=>x.toLowerCase()==m[2].toLowerCase())+1).padStart(2,'0')+'-'+m[1].padStart(2,'0')}
 m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})$/);if(m){const y=m[3].length==2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}

let PW='',VER=-1,QUEUE=ld('sb_q')||[],BUSY=false,LASTOK=0,OFFLINE=false,TT=0;

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(TT);TT=setTimeout(()=>t.classList.remove('on'),2600)}
function applyOp(st,op){
 const site=n=>{let i=si_(st,n);if(i<0){st.sites.push({name:n,rows:[]});i=st.sites.length-1}return st.sites[i]};
 const put=(s,r)=>{const j=s.rows.findIndex(x=>x.id==r.id);if(j>=0)s.rows[j]=r;else s.rows.push(r)};
 if(op.t==='put')put(site(op.site),op.row);
 else if(op.t==='del')st.sites.forEach(s=>{s.rows=s.rows.filter(x=>x.id!=op.id)});
 else if(op.t==='addSite'){if(si_(st,op.name)<0)st.sites.push({name:op.name,rows:[]})}
 else if(op.t==='renSite'){const i=si_(st,op.from);if(i>=0&&si_(st,op.to)<0)st.sites[i].name=op.to}
 else if(op.t==='delSite'){const i=si_(st,op.name);if(i>=0&&st.sites.length>1)st.sites.splice(i,1)}
 else if(op.t==='bulk'||op.t==='seed')op.sites.forEach(x=>{const s=site(x.name);x.rows.forEach(r=>put(s,r))})}
function setSt(){const e=$('sync');if(!ONLINE||!PW){e.textContent='';return}
 e.textContent=QUEUE.length?(OFFLINE?'⚠ Offline – '+QUEUE.length+' waiting to upload':'⟳ Saving…'):OFFLINE?'⚠ Offline – showing saved copy':'● Synced '+new Date(LASTOK||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 e.style.color=OFFLINE?'var(--rd)':'var(--ac)'}
async function call(b,pw){const r=await fetch(API,{method:'POST',body:JSON.stringify({pw:pw===undefined?PW:pw,...b})});return await r.json()}
function install(data){const nm=S.sites[S.cur]&&S.sites[S.cur].name;
 const st={cur:0,sites:data.sites.map(s=>({name:s.name,rows:s.rows.map(r=>({...r}))}))};
 QUEUE.forEach(o=>applyOp(st,o));if(!st.sites.length)st.sites=[{name:'New site',rows:[]}];
 const i=nm?si_(st,nm):-1;st.cur=i<0?0:i;S=st;save();render()}
function mutate(op){applyOp(S,op);save();if(ONLINE){QUEUE.push(op);saveQ();setSt();flush()}render()}
async function flush(){if(!ONLINE||BUSY||!PW)return;BUSY=true;let sent=0;
 try{for(;;){const snap=QUEUE.slice();
   const res=await call(snap.length?{ops:snap}:{read:1,ver:VER});
   if(res.err==='auth'){try{sessionStorage.removeItem('sb_role');sessionStorage.removeItem('sb_pw')}catch(e){}alert('The password was changed or expired. Please log in again.');location.reload();return}
   if(!res.ok)throw new Error(res.err||'server');
   OFFLINE=false;QUEUE.splice(0,snap.length);saveQ();sent+=snap.length;
   if(res.errs&&res.errs.length)alert('Some changes were not saved:\n'+res.errs.join('\n'));
   if(res.data){VER=res.ver;install(res.data)}
   LASTOK=Date.now();if(!QUEUE.length)break}
  if(sent)toast('Saved to shared database ✓')}
 catch(e){OFFLINE=true;if(QUEUE.length)toast('No internet – saved on this device, will upload automatically')}
 BUSY=false;setSt()}
async function auth(pw){
 if(!ONLINE){const x=await sha(pw);return x===PH.a?{role:'admin',pw}:x===PH.u?{role:'user',pw}:{err:'Wrong password'}}
 try{const res=await call({read:1,ver:-1},pw);
  if(res.err==='auth')return{err:'Wrong password'};
  if(!res.ok)return{err:'Server problem: '+res.err};
  return{role:res.role,pw,res}}
 catch(e){const x=await sha(pw);const r=x===PH.a?'admin':x===PH.u?'user':'';
  if(!r)return{err:'Wrong password (or no internet)'};
  if(!okS(ld('sb_cache')))return{err:'No internet connection. Connect once and try again.'};
  OFFLINE=true;return{role:r,pw,offline:true}}}
async function enter(a){PW=a.pw;try{sessionStorage.setItem('sb_pw',PW)}catch(e){}
 if(a.res){VER=a.res.ver;const d=a.res.data;
  if(!d.sites.length){if(a.role==='admin')await seed();else{alert('The shared database is still empty. Ask the admin to log in once to upload the data.');PW='';try{sessionStorage.removeItem('sb_pw')}catch(e){}return}}
  else install(d)}
 else if(a.offline&&okS(ld('sb_cache'))){S=ld('sb_cache');render()}
 setRole(a.role);flush()}
async function seed(){const L=ld('sitebook3');
 if(!okS(L)){install({sites:[]});toast('Shared database is empty – use Menu → Import Excel');return}
 const n=L.sites.reduce((s,x)=>s+x.rows.length,0);

  if(res.errs&&res.errs.length)alert(res.errs.join('\n'));
  if(res.ok&&res.data){VER=res.ver;install(res.data);toast('Uploaded to shared database ✓');return}}catch(e){}
